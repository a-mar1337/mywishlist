{% extends "base.html" %}

{% block title %}Подтверждение удаления — MyWishlist{% endblock %}

{% block content %}
<div class="card shadow-sm form-card">
    <div class="card-body">
        <h1 class="h3 mb-3">Подтвердите удаление</h1>

        <p>
            Вы действительно хотите удалить:
            <strong>{{ object }}</strong>?
        </p>

        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Удалить</button>
            <a href="{% url 'wishlists:dashboard' %}" class="btn btn-outline-secondary">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
